<title>s7lver — hero con ola de caracteres</title>
<style>
  :root{--bg:#08080b;--purple:#8b5cf6;--blue:#3b82f6;--green:#22c55e;--ink:#f4f4f6;--mut:#9ca3af;--dim:#5b6270;
    --line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.025);
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--disp:'Sora',system-ui,sans-serif;--maxw:1080px;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1{margin:0;font-weight:800;letter-spacing:-.03em}.mono{font-family:var(--mono)}
  .grad{background:linear-gradient(100deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:26px}
  .note{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:12px;border-bottom:1px solid var(--line);background:rgba(139,92,246,.04)}

  nav{position:relative;z-index:5;border-bottom:1px solid rgba(255,255,255,.05)}
  nav .row{display:flex;align-items:center;gap:26px;height:62px}
  .logo{font-weight:800;font-size:18px}.logo b{color:var(--purple)}
  .nlinks{display:flex;gap:22px;font-family:var(--mono);font-size:13px}.nlinks a{color:var(--mut)}
  nav .spacer{flex:1}.kbd{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  @media(max-width:720px){.nlinks{display:none}}

  /* HERO with layered backgrounds */
  .hero{position:relative;min-height:84vh;display:flex;align-items:center;overflow:hidden}
  .bg{position:absolute;inset:0;transition:opacity 1.6s ease;will-change:opacity}
  .bgGlow{background:
      radial-gradient(620px 480px at 16% 34%,rgba(139,92,246,.22),transparent 60%),
      radial-gradient(560px 460px at 88% 20%,rgba(59,130,246,.16),transparent 62%);}
  #wave{display:block;opacity:0}
  /* vignette so text stays readable over the wave */
  .veil{position:absolute;inset:0;background:
      radial-gradient(700px 380px at 30% 50%,rgba(8,8,11,.55),transparent 70%),
      linear-gradient(90deg,rgba(8,8,11,.6),transparent 55%);pointer-events:none;z-index:1}
  .hero .wrap{position:relative;z-index:2;width:100%}
  .block{max-width:600px}
  .cmd{font-family:var(--mono);font-size:13.5px;color:var(--green);margin-bottom:18px;display:inline-flex;align-items:center}.cmd::before{content:"$ ";opacity:.75}
  .cur{display:inline-block;width:8px;height:1em;background:var(--green);margin-left:3px;vertical-align:-1px;animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
  .hero h1{font-size:clamp(32px,5vw,54px);line-height:1.1}
  .cta{display:flex;flex-wrap:wrap;gap:13px;margin-top:30px}
  .btn{font-family:var(--mono);font-size:13.5px;padding:11px 20px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.2s;display:inline-flex;gap:8px;align-items:center}
  .btn-p{background:linear-gradient(100deg,var(--purple),var(--blue));color:#fff;font-weight:600;box-shadow:0 10px 28px -14px rgba(139,92,246,.8)}.btn-p:hover{transform:translateY(-2px)}
  .btn-d{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:34px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:7px 12px}

  /* preview controls */
  .ctrl{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:6px;background:rgba(10,10,15,.9);border:1px solid var(--line);border-radius:999px;padding:6px}
  .ctrl button{font-family:var(--mono);font-size:11px;color:var(--mut);background:transparent;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
  .ctrl button.on{background:rgba(139,92,246,.2);color:#fff}
</style>

<div class="note">hero: el fondo se funde entre el glow y la ola de caracteres (MidJourney) cada ~8s · usa los botones para forzar uno</div>

  <span class="logo">s7<b>lver</b></span>
  <div class="nlinks"><a>about</a><a>skills</a><a>projects</a><a>htb</a><a>github</a><a>contact</a></div>

</div></nav>

<section class="hero">
  <div class="bg bgGlow" id="glow"></div>
  <canvas class="bg" id="wave"></canvas>
  <div class="veil"></div>
  <div class="wrap"><div class="block">
    <div class="cmd mono">whoami<span class="cur"></span></div>
    <h1>Hi, I'm <span class="grad">s7lver</span><br>Developer &amp; Cybersecurity Student</h1>
    <div class="cta"><button class="btn btn-p">View Projects →</button><button class="btn btn-d">$ start hacking</button></div>
    <div class="chips"><span class="chip">TypeScript</span><span class="chip">Next.js</span><span class="chip">Rust</span><span class="chip">Go</span><span class="chip">Python</span><span class="chip">Linux</span><span class="chip">Docker</span></div>
  </div></div>
</section>

<div class="ctrl">
  <button id="bAuto" class="on">auto</button>
  <button id="bGlow">glow</button>
  <button id="bWave">ola</button>
</div>

<script>
/* ===== flow-field character wave (MidJourney style) ===== */
var cv=document.getElementById('wave'),ctx=cv.getContext('2d'),hero=document.querySelector('.hero');
var glyphs=[' ',' ','.','·',':','-','=','+','/','\\','|','*','#'];
var CELL=12,t=0,dpr=Math.min(2,window.devicePixelRatio||1),cols,rows;
function resize(){
  var w=hero.clientWidth,h=hero.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cols=Math.ceil(w/CELL);rows=Math.ceil(h/CELL);
  ctx.font='12px '+getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.textBaseline='top';
}
window.addEventListener('resize',resize);
function field(x,y,t){
  return Math.sin(x*0.16+t*0.55)+Math.sin(y*0.21-t*0.4)+Math.sin((x+y)*0.085+t*0.32)+Math.sin((x-y)*0.11-t*0.48);
}
function draw(){
  t+=0.016;
  var w=cv.width/dpr,h=cv.height/dpr;
  ctx.clearRect(0,0,w,h);
  for(var j=0;j<rows;j++){
    for(var i=0;i<cols;i++){
      var v=field(i*0.5,j*0.5,t);          // -4..4
      var n=(v+4)/8;                         // 0..1
      if(n<0.34)continue;                    // dark cells = empty
      var gi=Math.min(glyphs.length-1,Math.floor(n*glyphs.length));
      var ch=glyphs[gi];
      if(ch===' ')continue;
      var a=0.16+n*0.5;                      // subtle alpha
      ctx.fillStyle='rgba(245,245,250,'+a.toFixed(3)+')';
      ctx.fillText(ch,i*CELL,j*CELL);
    }
  }
  requestAnimationFrame(draw);
}
resize();draw();

/* ===== crossfade auto every 8s + manual ===== */
var glow=document.getElementById('glow');
var mode='auto',showWave=false,timer;
function apply(){ glow.style.opacity=showWave?0:1; cv.style.opacity=showWave?1:0; }
function startAuto(){ clearInterval(timer); timer=setInterval(function(){ showWave=!showWave; apply(); },8000); }
function setMode(m){
  mode=m;
  document.getElementById('bAuto').classList.toggle('on',m==='auto');
  document.getElementById('bGlow').classList.toggle('on',m==='glow');
  document.getElementById('bWave').classList.toggle('on',m==='wave');
  if(m==='auto'){startAuto();}
  else{clearInterval(timer);showWave=(m==='wave');apply();}
}
document.getElementById('bAuto').onclick=function(){showWave=false;apply();setMode('auto');};
document.getElementById('bGlow').onclick=function(){setMode('glow');};
document.getElementById('bWave').onclick=function(){setMode('wave');};
apply();startAuto();
</script>
